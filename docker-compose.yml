services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hisign-backend
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8080"
    environment:
      SPRING_PROFILES_ACTIVE: ""
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"
      SERVER_PORT: 8080
      CUSTOM_JWT_SECRET: ${CUSTOM_JWT_SECRET}
      CUSTOM_JWT_EXPIRATION: ${CUSTOM_JWT_EXPIRATION:-86400000}
      CUSTOM_AES_SECRET: ${CUSTOM_AES_SECRET}
      CUSTOM_HOST_CLIENT: ${CUSTOM_HOST_CLIENT:-https://hisign.walab.info}
      CUSTOM_HOST_SERVER: ${CUSTOM_HOST_SERVER:-https://hisign.walab.info}
      HISNET_ACCESS_KEY: ${HISNET_ACCESS_KEY}
      HISNET_URL: ${HISNET_URL:-https://hisign.walab.info}
      HISNET_RETURN_URL: ${HISNET_RETURN_URL:-https://hisign.walab.info/login/callback}
      FILE_SIGNATURE_DIR: ${FILE_SIGNATURE_DIR:-/app/uploads/signatures}
      FILE_DOCUMENT_DIR: ${FILE_DOCUMENT_DIR:-/app/uploads/documents}
      FILE_SUBJECTS_WORKLOG_PATH: ${FILE_SUBJECTS_WORKLOG_PATH:-/app/subjects/subjects_worklog.txt}
      FILE_SUBJECTS_RESEARCH_PATH: ${FILE_SUBJECTS_RESEARCH_PATH:-/app/subjects/subjects_research.txt}
      FILE_UPLOAD_DIR: ${FILE_UPLOAD_DIR:-/app/uploads}
      FILE_TEMP_DIR: ${FILE_TEMP_DIR:-/app/temp}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-hisign.walab.info}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-Lax}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_ACCESS_TOKEN_MAX_AGE: ${COOKIE_ACCESS_TOKEN_MAX_AGE:-3600}
      COOKIE_REFRESH_TOKEN_MAX_AGE: ${COOKIE_REFRESH_TOKEN_MAX_AGE:-1209600}
      COOKIE_SIGNER_TOKEN_MAX_AGE: ${COOKIE_SIGNER_TOKEN_MAX_AGE:-3600}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "true"
      TZ: Asia/Seoul
    volumes:
      - uploads_data:/app/uploads
      - ./subjects:/app/subjects:ro
    networks:
      - hisign-network

volumes:
  uploads_data:

networks:
  hisign-network:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.172.0/24
