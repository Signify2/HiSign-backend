services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hisign-backend
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8080"
    environment:
      SPRING_PROFILES_ACTIVE: ""
      TZ: Asia/Seoul
    volumes:
      - uploads_data:/app/uploads
      - ./subjects:/app/subjects:ro
    networks:
      hisign-network:
        ipv4_address: 10.10.172.1

volumes:
  uploads_data:

networks:
  hisign-network:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.172.0/24
